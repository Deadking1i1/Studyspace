{% extends 'layout.html' %}

{% block page_title %}Edit Profile{% endblock %}
{% block page_subtitle %}Update your bio, course and profile picture.{% endblock %}

{% block content %}
<div class="card">
    <h3>Edit Profile</h3>
    <form method="POST" enctype="multipart/form-data">
        {{ csrf_token() }}
        <div class="form-row">
            <label for="course">Course</label>
            <input id="course" name="course" value="{{ user.course or '' }}">
        </div>
        <div class="form-row">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="4">{{ user.bio or '' }}</textarea>
        </div>
        <div class="form-row">
            <label for="profile_pic">Profile picture</label>
            <input id="profile_pic" name="profile_pic" type="file" accept="image/*">
        </div>
        <button type="submit">Save</button>
    </form>
</div>
{% endblock %}
