{% extends 'layout.html' %}

{% block page_title %}Reset Password{% endblock %}
{% block page_subtitle %}Request a secure reset link for your Study Space account.{% endblock %}

{% block content %}
<div class="auth-panel card">
    <h2>Reset password</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" required>
        </div>
        <button type="submit">Prepare reset link</button>
    </form>
    <p class="auth-footer"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
</div>
{% endblock %}
