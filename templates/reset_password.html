{% extends 'layout.html' %}

{% block page_title %}Set New Password{% endblock %}
{% block page_subtitle %}Choose a strong password to secure your Study Space account.{% endblock %}

{% block content %}
<div class="auth-panel card">
    <h2>Set new password</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <label for="password">New password</label>
            <input id="password" type="password" name="password" autocomplete="new-password" required>
        </div>
        <div class="form-row">
            <label for="confirm_password">Confirm new password</label>
            <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" required>
        </div>
        <button type="submit">Reset password</button>
    </form>
</div>
{% endblock %}
