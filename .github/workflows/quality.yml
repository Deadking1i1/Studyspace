name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, test, and migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: study_space_ci
          POSTGRES_USER: study_space
          POSTGRES_PASSWORD: study_space_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study_space -d study_space_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      STUDY_SPACE_DATABASE_URL: postgresql://study_space:study_space_ci@127.0.0.1:5432/study_space_ci
      STUDY_SPACE_FRESH_DATABASE_URL: postgresql://study_space:study_space_ci@127.0.0.1:5432/study_space_ci
      STUDY_SPACE_APP_BASE_URL: https://study-space.invalid
      AUTH_SECRET: ci-only-auth-secret-with-at-least-thirty-two-characters
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: re_ci_placeholder_not_a_real_key
      EMAIL_FROM: Study Space CI <accounts@study-space.invalid>
      SPOTIFY_CLIENT_ID: ci-placeholder-client-id
      SPOTIFY_CLIENT_SECRET: ci-placeholder-client-secret
      SPOTIFY_REDIRECT_URI: https://study-space.invalid/integrations/spotify/callback
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: study-space-ci
      STORAGE_REGION: auto
      STORAGE_ENDPOINT_URL: https://storage.study-space.invalid
      STORAGE_ACCESS_KEY_ID: ci-placeholder
      STORAGE_SECRET_ACCESS_KEY: ci-placeholder-not-a-secret
      UPLOAD_SCANNER_URL: https://scanner.study-space.invalid/scan
      UPLOAD_SCANNER_TOKEN: ci-placeholder-not-a-secret
      PRIVATE_BETA_ENABLED: "true"
      BETA_ALLOWED_EMAILS: beta@study-space.invalid
      TRUST_PROXY_HEADERS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: npm ci

      - name: Install Flask test dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run Flask regression tests
        run: python -m unittest discover -s tests

      - name: Validate Drizzle migration history
        run: npm run db:check

      - name: Apply and verify migrations on fresh PostgreSQL
        run: npm run db:verify-fresh

      - name: Validate production configuration
        run: npm run security:check-production
        env:
          NODE_ENV: production

      - name: Build production application
        run: npm run build

      - name: Build production container
        run: docker build --tag study-space-ci:${{ github.sha }} .

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
